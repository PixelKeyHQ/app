<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Pixel Key</title>
<style>__STYLE__
  :root { --tertiary: #A1A1AA; --google-fill: #FFFFFF; --google-stroke: #747775; --google-text: #1F1F1F; }
  @media (prefers-color-scheme: dark) {
    :root { --tertiary: #71717A; --google-fill: #131314; --google-stroke: #8E918F; --google-text: #E3E3E3; }
  }
  h3 { margin: 0; }
  .screen { display: flex; flex-direction: column; min-height: 100vh; width: 100%; max-width: 480px; margin: 0 auto; }
  .nav { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; }
  .nav-side { width: 64px; display: flex; }
  .nav-side.end { justify-content: flex-end; }
  .nav h2 { font-size: 17px; font-weight: 600; }
  .nav-text { font-size: 17px; font-weight: 600; color: var(--accent); }
  .nav-text:active { opacity: 0.6; }
  .content { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 16px; }
  .bottom { display: flex; flex-direction: column; gap: 10px; padding: 8px 20px 40px; }

  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .hero h1 { font-size: 28px; line-height: 34px; font-weight: 700; }
  .app-icon.large { width: 88px; height: 88px; border-radius: 23px; box-shadow: 0 8px 24px rgba(110,75,199,0.28); }
  #home .bottom { gap: 16px; padding: 0 16px 40px; }
  .list { padding: 0; overflow: hidden; }
  .row { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: 17px; text-align: left; }
  .row:active:not(:disabled) { opacity: 0.7; }
  .row-label { flex: 1; }
  .row-value { color: var(--muted); }
  .row svg { color: var(--tertiary); }
  .actions, #home-actions { display: flex; flex-direction: column; gap: 6px; }
  .actions { padding: 0 4px; }
  .actions .error { padding-bottom: 4px; }
  .google {
    width: 100%; min-height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid var(--google-stroke);
    background: var(--google-fill); color: var(--google-text); font-size: 16px; font-weight: 500; letter-spacing: 0.25px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .google:active { opacity: 0.85; }
  .link { height: 44px; font-size: 16px; font-weight: 500; color: var(--accent); }
  .link:active { opacity: 0.6; }
  .working { height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; color: var(--muted); }
  .working + span { display: block; height: 50px; }
  .spinner { animation: spin 0.9s linear infinite; }
  .spinner circle { stroke: var(--separator); }
  .spinner path { stroke: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  #models .content { gap: 22px; }
  .intro { padding: 0 4px; font-size: 15px; line-height: 21px; color: var(--muted); }
  .section { display: flex; flex-direction: column; gap: 6px; }
  .section h3 { padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .option { width: 100%; min-height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 17px; text-align: left; }
  .option + .option { border-top: 0.5px solid var(--separator); }
  .option:active { background: var(--default); }
  .option span { flex: 1; }
  .option svg { color: var(--accent); }
  .option[aria-checked="false"] svg { visibility: hidden; }
  .foot { padding: 6px 4px 0; font-size: 13px; line-height: 18px; color: var(--muted); }

  .hint { padding: 0 4px; font-size: 13px; line-height: 18px; color: var(--muted); }

  #privacy-cover { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<main>

<section class="screen" id="home" aria-labelledby="title">
  <div class="hero">
    <span class="app-icon large" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></svg>
    </span>
    <h1 id="title">Pixel Key</h1>
  </div>
  <div class="bottom">
    <div class="card list">
      <button type="button" class="row" id="model-row">
        <span class="row-label">备份机型</span>
        <span class="row-value" id="model-value"></span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="actions">
      <div id="working" hidden>
        <div class="working" role="status">
          <svg class="spinner" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke-width="2.5"/><path d="M10 2a8 8 0 0 1 8 8" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>
          正在生成…
        </div>
        <span></span>
      </div>
      <div id="home-actions">
        <p class="error center" id="home-error" role="alert"></p>
        <button type="button" class="google" id="google">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          登录 Google 获取配置密钥
        </button>
        <button type="button" class="link" id="manual-open">手动配置密钥</button>
      </div>
    </div>
  </div>
</section>

<section class="screen" id="models" aria-labelledby="models-title" hidden>
  <div class="nav">
    <span class="nav-side"></span>
    <h2 id="models-title">备份机型</h2>
    <span class="nav-side end"><button type="button" class="nav-text" id="models-done">完成</button></span>
  </div>
  <div class="content">
    <p class="intro">照片会以所选机型的身份备份，画质和是否占用存储空间按这台机型的权益计算。</p>
    <div class="section">
      <h3 id="original-title">原画质 · 不占空间</h3>
      <div class="card list" role="radiogroup" aria-labelledby="original-title" id="original-models"></div>
    </div>
    <div class="section">
      <h3 id="saver-title">节省空间画质 · 不占空间</h3>
      <div class="card list" role="radiogroup" aria-labelledby="saver-title" id="saver-models"></div>
      <p class="foot">Pixel 5a 及之后的机型没有免费备份权益。</p>
    </div>
  </div>
</section>

<section class="screen" id="manual" aria-labelledby="manual-title" hidden>
  <div class="nav">
    <span class="nav-side">
      <button type="button" class="round" id="manual-back" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5L8.5 12l6.5 6.5"/></svg>
      </button>
    </span>
    <h2 id="manual-title">手动配置</h2>
    <span class="nav-side"></span>
  </div>
  <form id="form" class="content" autocomplete="off" novalidate>
    <button type="button" class="soft-pill" id="paste">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="10" height="4" rx="1"/><path d="M7 6H6a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 18 6h-1"/></svg>
      粘贴认证请求自动填写
    </button>
    <p class="error center" id="manual-error" role="alert"></p>
    <div class="field">
      <label for="email">邮箱</label>
      <input class="input" id="email" type="text" inputmode="email" placeholder="name@gmail.com" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="email-error">
      <p class="error" id="email-error" role="alert"></p>
    </div>
    <div class="field">
      <label for="token">Master Token</label>
      <input class="input mono" id="token" type="password" placeholder="aas_et/…" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="token-error">
      <p class="error" id="token-error" role="alert"></p>
    </div>
    <div class="field">
      <label for="androidId">Android ID</label>
      <input class="input mono" id="androidId" type="text" placeholder="16 位十六进制" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="androidId-error">
      <p class="error" id="androidId-error" role="alert"></p>
    </div>
    <div class="field">
      <label for="alias">绑定 alias</label>
      <input class="input mono" id="alias" type="password" placeholder="可选" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="alias-error alias-hint">
      <p class="error" id="alias-error" role="alert"></p>
      <p class="hint" id="alias-hint">账号绑定过设备时才需要</p>
    </div>
  </form>
  <div class="bottom">
    <button type="submit" form="form" class="pill" id="generate" disabled>生成</button>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="nav">
    <span class="nav-side"><button type="button" class="nav-text" id="done">完成</button></span>
    <span class="nav-side"></span>
  </div>
  <div class="content">
    <div class="account">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <div>
        <p class="account-email" id="account"></p>
        <p class="account-meta" id="account-meta"></p>
      </div>
    </div>

    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-qr" aria-controls="panel" aria-selected="true">二维码</button>
      <button type="button" role="tab" id="tab-text" aria-controls="panel" aria-selected="false" tabindex="-1">文本</button>
    </div>

    <div class="card" id="panel" role="tabpanel" aria-labelledby="tab-qr">
      <div class="view" id="view-qr">
        <div class="qr" id="qr" role="img" aria-label="连接信息二维码"></div>
        <p class="caption">用备份 App 扫码导入</p>
      </div>
      <div class="view" id="view-qr-too-big" hidden>
        <p class="caption">太长，放不进二维码，请用文本。</p>
      </div>
      <div class="view" id="view-text" hidden>
        <div class="code mono" id="code" tabindex="0" role="region" aria-label="连接信息"></div>
        <p class="caption">复制后在备份 App 中粘贴导入</p>
      </div>
    </div>

    <p class="note">这段信息能直接登录你的 Google 账号，只在自己的设备上扫码或粘贴。</p>
  </div>
  <div class="bottom">
    <p class="error center" id="copy-error" role="alert"></p>
    <button type="button" class="pill" id="copy">
      <svg id="copy-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="10" height="4" rx="1"/><path d="M7 6H6a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 18 6h-1"/></svg>
      <svg id="copied-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span id="copy-label">复制连接信息</span>
    </button>
    <p class="sr" id="copy-status" role="status"></p>
  </div>
</section>

</main>
<div id="privacy-cover" hidden>
  <span class="app-icon large" aria-hidden="true">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></svg>
  </span>
</div>
<script src="/renderer.js"></script>
</body>
</html>
