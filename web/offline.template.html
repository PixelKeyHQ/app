<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>Pixel Key 离线配置</title>
<style>
  :root {
    --bg: #f4f2fb; --surface: #ffffff; --fg: #1a1724; --muted: #6b6480;
    --accent: #6e4bc7; --accent-weak: #efeafb; --border: #e3def0;
    --danger: #b3261e; --warn-bg: #fff6e6; --warn-fg: #8a5a00; --warn-border: #f1dca7;
    --radius: 16px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    padding: 16px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .note { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-border); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
  .note b { color: var(--warn-fg); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  label .opt { color: var(--muted); font-weight: 400; }
  input, select, textarea {
    width: 100%; font-size: 15px; color: var(--fg); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .mono { font-family: var(--mono); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .err { color: var(--danger); font-size: 12px; margin-top: 5px; min-height: 0; }
  button {
    font-size: 15px; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; width: 100%;
  }
  button.ghost { color: var(--accent); background: var(--accent-weak); width: auto; padding: 8px 14px; font-size: 13px; }
  button:active { opacity: 0.85; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .row h2 { font-size: 15px; margin: 0; }
  textarea { font-family: var(--mono); font-size: 12px; min-height: 108px; resize: vertical; word-break: break-all; }
  #qrWrap { display: none; justify-content: center; margin-top: 14px; }
  #qr { width: 248px; height: 248px; background: #fff; border-radius: 16px; padding: 12px; }
  #qr svg { display: block; width: 100%; height: 100%; }
  #output { display: none; }
  .quality { color: var(--muted); font-size: 13px; margin-top: 10px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
  footer p { margin: 6px 0; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .licenses { white-space: pre-wrap; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Pixel Key 离线配置</h1>
  <p class="sub">用已经导出的凭证生成备份配置。全程离线，不联网。</p>

  <div class="note">
    <b>请在断网状态下使用本页。</b> 这些凭证可以完全访问你的 Google 账号，只在自己的设备上填写。
    页面不会发出任何网络请求，可以保存成本地文件离线打开。
  </div>

  <form class="card" id="form" autocomplete="off" novalidate>
    <div class="field">
      <label for="email">邮箱</label>
      <input id="email" type="text" inputmode="email" placeholder="name@gmail.com" spellcheck="false" autocapitalize="off">
      <div class="err" id="err-email"></div>
    </div>
    <div class="field">
      <label for="token">Master Token</label>
      <input id="token" class="mono" type="text" placeholder="aas_et/…" spellcheck="false" autocapitalize="off" autocomplete="off">
      <div class="err" id="err-token"></div>
    </div>
    <div class="field">
      <label for="androidId">Android ID</label>
      <input id="androidId" class="mono" type="text" placeholder="16 位十六进制" spellcheck="false" autocapitalize="off">
      <div class="err" id="err-androidId"></div>
    </div>
    <div class="field">
      <label for="alias">绑定 alias <span class="opt">· 可选</span></label>
      <input id="alias" class="mono" type="text" placeholder="账号绑定过设备时才需要" spellcheck="false" autocapitalize="off" autocomplete="off">
      <div class="hint">账号被灰度到设备绑定时才需要。换 token 返回 403 BadAuthentication，通常就是缺它。</div>
      <div class="err" id="err-alias"></div>
    </div>
    <div class="field">
      <label for="model">备份机型</label>
      <select id="model"></select>
      <div class="quality" id="quality"></div>
    </div>
    <button type="submit">生成配置</button>
    <div class="err" id="err-form" style="margin-top:10px;text-align:center"></div>
  </form>

  <div class="card" id="output">
    <div class="row">
      <h2>配置文本</h2>
      <button type="button" class="ghost" id="copy">复制</button>
    </div>
    <textarea id="profileText" readonly spellcheck="false" aria-label="配置文本"></textarea>
    <div id="qrWrap"><div id="qr"></div></div>
  </div>

  <footer>
    <p>把配置文本或二维码导入兼容的备份客户端即可。配置等同账号凭证，只在本人设备上使用。</p>
    <details>
      <summary>内置开源库许可证</summary>
      <div class="licenses">__LICENSES__</div>
    </details>
  </footer>
</main>

<script>__BUNDLE__</script>
<script>
(function () {
  var PK = globalThis.PixelKey;
  var $ = function (id) { return document.getElementById(id); };
  var fieldIds = ['email', 'token', 'androidId', 'alias'];

  // Build the model picker, grouped like the app.
  var model = $('model');
  function group(label, list) {
    var og = document.createElement('optgroup');
    og.label = label;
    list.forEach(function (name) {
      var o = document.createElement('option');
      o.value = name; o.textContent = name;
      og.appendChild(o);
    });
    model.appendChild(og);
  }
  group('原画质 · 不占空间', PK.ORIGINAL_MODELS);
  group('节省空间画质 · 不占空间', PK.SAVER_MODELS);
  model.value = PK.DEFAULT_MODEL;

  function showQuality() {
    $('quality').textContent = PK.isOriginalModel(model.value)
      ? '原画质 · 不占用 Google 相册空间'
      : '节省空间画质 · 不占用 Google 相册空间';
  }
  model.addEventListener('change', showQuality);
  showQuality();

  function clearErrors() {
    fieldIds.forEach(function (k) { $('err-' + k).textContent = ''; });
    $('err-form').textContent = '';
  }

  function readFields() {
    return {
      email: $('email').value, token: $('token').value,
      androidId: $('androidId').value, alias: $('alias').value,
    };
  }

  // Render the QR matrix as inline SVG (same geometry as the app's ProfileQr).
  function renderQr(link) {
    var wrap = $('qrWrap'), box = $('qr');
    box.textContent = '';
    try {
      var cells = PK.qrMatrix(link);
      var side = cells.length + 4;
      var d = '';
      for (var y = 0; y < cells.length; y++) {
        var rowArr = cells[y];
        for (var x = 0; x < rowArr.length;) {
          if (!rowArr[x]) { x++; continue; }
          var end = x; while (rowArr[end]) end++;
          d += 'M' + (x + 2) + ',' + (y + 2) + 'h' + (end - x) + 'v1h-' + (end - x) + 'z';
          x = end;
        }
      }
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + side + ' ' + side);
      svg.setAttribute('shape-rendering', 'crispEdges');
      var bg = document.createElementNS(ns, 'rect');
      bg.setAttribute('width', side); bg.setAttribute('height', side); bg.setAttribute('fill', '#fff');
      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d', d); path.setAttribute('fill', '#000');
      svg.appendChild(bg); svg.appendChild(path);
      box.appendChild(svg);
      wrap.style.display = 'flex';
    } catch (e) {
      // Too large for one QR — text output still works.
      wrap.style.display = 'none';
    }
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    clearErrors();
    var fields = readFields();
    var errs = PK.manualErrors(fields);
    var keys = Object.keys(errs);
    if (keys.length) {
      keys.forEach(function (k) { $('err-' + k).textContent = errs[k]; });
      $('output').style.display = 'none';
      return;
    }
    try {
      var profile = PK.manualProfile(fields, model.value);
      var link = PK.profileLink(profile);
      $('profileText').value = link;
      renderQr(link);
      $('output').style.display = 'block';
    } catch (e) {
      $('err-form').textContent = PK.safeMessage(e);
      $('output').style.display = 'none';
    }
  });

  $('copy').addEventListener('click', function () {
    var ta = $('profileText');
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () {}, function () {});
      ok = true;
    }
    $('copy').textContent = ok ? '已复制' : '请手动复制';
    setTimeout(function () { $('copy').textContent = '复制'; }, 1500);
  });
})();
</script>
</body>
</html>
